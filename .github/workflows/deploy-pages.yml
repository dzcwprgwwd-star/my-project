name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/ui-ux-pro-max-install-xbpni6]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Publish the contents of site/ to the gh-pages branch.
      # This avoids the github-pages deployment environment (and its
      # branch-protection rules) entirely; Pages serves from gh-pages.
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
